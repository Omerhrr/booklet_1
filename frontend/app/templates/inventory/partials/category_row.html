<tr class="hover:bg-gray-50 dark:hover:bg-gray-700 transition" id="category-{{ category.id }}" hx-get="{{ url_for('inventory.get_category', category_id=category.id) }}" hx-trigger="refresh" hx-swap="outerHTML">
    <td class="px-6 py-4 whitespace-nowrap">
        <div class="flex items-center">
            <div class="w-10 h-10 bg-purple-100 dark:bg-purple-900 rounded-lg flex items-center justify-center">
                <svg class="w-5 h-5 text-purple-600 dark:text-purple-300" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"/>
                </svg>
            </div>
            <div class="ml-4">
                <div class="text-sm font-medium text-gray-900 dark:text-white">{{ category.name }}</div>
            </div>
        </div>
    </td>
    <td class="px-6 py-4 text-sm text-gray-500 dark:text-gray-400">{{ category.product_count|default(0) }}</td>
    <td class="px-6 py-4 text-sm text-gray-500 dark:text-gray-400">{{ category.description|default('-') }}</td>
    <td class="px-6 py-4 text-right">
        <div class="flex items-center justify-end gap-2">
            <button hx-get="{{ url_for('inventory.edit_category', category_id=category.id) }}"
                    hx-target="#category-{{ category.id }}"
                    hx-swap="outerHTML"
                    class="text-yellow-600 dark:text-yellow-500 hover:underline text-sm">Edit</button>
            <button hx-delete="{{ url_for('inventory.delete_category', category_id=category.id) }}"
                    hx-target="#category-{{ category.id }}"
                    hx-swap="outerHTML swap:0.5s"
                    hx-confirm="Are you sure you want to delete this category?"
                    class="text-red-600 dark:text-red-500 hover:underline text-sm">Delete</button>
        </div>
    </td>
</tr>
